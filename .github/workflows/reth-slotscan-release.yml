name: Build SlotScan Reth

on:
  workflow_dispatch:
    inputs:
      reth_version:
        description: Stable upstream Reth tag, for example v2.4.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: slotscan-reth-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Resolve requested release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RETH_VERSION: ${{ inputs.reth_version }}
        run: |
          [[ "$INPUT_RETH_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "reth_version must be a stable tag such as v2.4.0" >&2
            exit 2
          }
          downstream="${INPUT_RETH_VERSION#v}-slotscan.1"
          tag="reth-v${downstream}"
          exists=false
          tag_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
          elif git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_exists=true
          fi
          {
            echo "reth_tag=$INPUT_RETH_VERSION"
            echo "downstream=$downstream"
            echo "tag=$tag"
            echo "exists=$exists"
            echo "tag_exists=$tag_exists"
            echo "base_sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"

      - name: Report existing release
        if: steps.release.outputs.exists == 'true'
        run: |
          echo "### ${{ steps.release.outputs.tag }} already exists" >>"$GITHUB_STEP_SUMMARY"
          echo "No source, tag, or release was changed." >>"$GITHUB_STEP_SUMMARY"

      - name: Prepare exact Reth upgrade
        if: steps.release.outputs.exists != 'true'
        run: scripts/update-reth.sh "${{ steps.release.outputs.reth_tag }}"

      - name: Validate generated source changes
        if: steps.release.outputs.exists != 'true'
        run: |
          unexpected="$(
            git status --short |
              awk '{print $2}' |
              grep -Ev '^(reth-slotscan/Cargo.toml|reth-slotscan/Cargo.lock|reth-slotscan/rust-toolchain.toml)$' ||
              true
          )"
          [[ -z "$unexpected" ]] || {
            echo "upgrade changed unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          }

      - name: Commit prepared source
        if: steps.release.outputs.exists != 'true'
        run: |
          if [[ -n "$(git status --short)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reth-slotscan/Cargo.toml reth-slotscan/Cargo.lock \
              reth-slotscan/rust-toolchain.toml
            git commit -m "build(reth): update to ${{ steps.release.outputs.reth_tag }}"
          fi

      - name: Build and validate drop-in artifact
        if: steps.release.outputs.exists != 'true'
        id: build
        run: scripts/build-reth.sh

      - name: Publish source, tag, and release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_SHA: ${{ steps.release.outputs.base_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.downstream }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
        run: |
          git fetch origin master
          [[ "$(git rev-parse origin/master)" == "$INITIAL_SHA" ]] || {
            echo "master changed while the release was building; rerun the workflow" >&2
            exit 1
          }
          if [[ "$TAG_EXISTS" == "true" ]]; then
            [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$(git rev-parse HEAD)" ]] || {
              echo "existing tag $RELEASE_TAG does not point to the built source" >&2
              exit 1
            }
          fi
          git push origin HEAD:master
          if [[ "$TAG_EXISTS" != "true" ]]; then
            git tag -a "$RELEASE_TAG" -m "SlotScan Reth ${RELEASE_VERSION}"
            git push origin "$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" "$ARCHIVE" \
            --verify-tag \
            --title "SlotScan Reth ${RELEASE_VERSION}" \
            --generate-notes
