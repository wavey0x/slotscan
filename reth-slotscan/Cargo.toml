[package]
name = "reth-slotscan"
version = "2.4.1-slotscan.1"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
alloy-primitives = { version = "=1.6.1", features = ["serde"] }
alloy-rpc-types-trace = { version = "=2.1.1", default-features = false }
async-trait = "0.1.89"
clap = { version = "4", features = ["derive"] }
jsonrpsee = { version = "=0.26.0", features = ["server", "macros"] }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "8eb210175687c9f0c889a3b6795c16781d830e3a", features = ["node"] }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", rev = "8eb210175687c9f0c889a3b6795c16781d830e3a" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", rev = "8eb210175687c9f0c889a3b6795c16781d830e3a" }
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", rev = "8eb210175687c9f0c889a3b6795c16781d830e3a" }
revm-inspectors = "=0.41.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
production = [
    "alloy-primitives/asm-keccak",
    "alloy-primitives/keccak-cache-global",
    "reth-ethereum/jemalloc",
    "reth-ethereum/js-tracer",
    "reth-ethereum/keccak-cache-global",
    "reth-ethereum/otlp",
    "reth-ethereum/portable",
    "reth-ethereum-cli/asm-keccak",
    "reth-ethereum-cli/jemalloc",
    "reth-ethereum-cli/min-trace-logs",
    "reth-ethereum-cli/otlp",
    "reth-ethereum-cli/otlp-logs",
    "reth-node-core/asm-keccak",
    "reth-node-core/jemalloc",
    "reth-node-core/keccak-cache-global",
    "reth-node-core/min-trace-logs",
    "reth-node-core/otlp",
    "reth-node-core/otlp-logs",
]

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
