[package]
name = "reth-slotscan"
version = "2.10.0-slotscan.1"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
alloy-primitives = { version = "=1.6.1", features = ["serde"] }
alloy-rpc-types-trace = { version = "=2.5.0", default-features = false }
async-trait = "0.1.89"
clap = { version = "4", features = ["derive"] }
jsonrpsee = { version = "=0.26.0", features = ["server", "macros"] }
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
evm2-inspectors = { git = "https://github.com/alloy-rs/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "f5192ac72d92bc1e656a6939796421af76544af4", features = ["node"] }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", rev = "f5192ac72d92bc1e656a6939796421af76544af4" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", rev = "f5192ac72d92bc1e656a6939796421af76544af4" }
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", rev = "f5192ac72d92bc1e656a6939796421af76544af4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
alloy-consensus = "=2.5.0"
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
production = [
    "alloy-primitives/asm-keccak",
    "alloy-primitives/keccak-cache-global",
    "reth-ethereum/jemalloc",
    "reth-ethereum/js-tracer",
    "reth-ethereum/keccak-cache-global",
    "reth-ethereum/otlp",
    "reth-ethereum/portable",
    "reth-ethereum-cli/asm-keccak",
    "reth-ethereum-cli/jemalloc",
    "reth-ethereum-cli/min-trace-logs",
    "reth-ethereum-cli/otlp",
    "reth-ethereum-cli/otlp-logs",
    "reth-node-core/asm-keccak",
    "reth-node-core/jemalloc",
    "reth-node-core/keccak-cache-global",
    "reth-node-core/min-trace-logs",
    "reth-node-core/otlp",
    "reth-node-core/otlp-logs",
]

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

# Reth v2.10.0 patches evm2 through the pre-transfer URL to select its LLVM-compatible fork.
[patch."https://github.com/alloy-rs/evm2"]
evm2 = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
evm2-inspectors = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
evm2-jit = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }

[patch.crates-io]
# Reth v2.10.0 needs LLVM 23 support before inkwell publishes it.
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "c9d9734ae17dbaf1d9902dab3b8ee9d2041781ff" }
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-rpc-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
